# Маппинг статусов DoQA
# ID статусов задаются через .env (TBD до получения документации)

statuses:
  review:
    name: "Ревью"
    id: "${DOQA_REVIEW_STATUS_ID}"  # TBD
    description: "Кейс на ревью"

  archive:
    name: "Архив"
    id: "${DOQA_ARCHIVE_STATUS_ID}"  # TBD
    description: "Устаревший кейс"

  # Дополнительные статусы (для справки)
  draft:
    name: "Черновик"
    id: ""  # TBD

  error:
    name: "Ошибка"
    id: ""  # TBD

  ready:
    name: "Готов"
    id: ""  # TBD

  obsolete:
    name: "Устарел"
    id: ""  # TBD

# Правила переходов статусов
transitions:
  new_case:
    target: "review"
    description: "Новые кейсы после импорта"

  updated_case:
    target: "review"
    description: "Актуализированные кейсы"

  outdated_case:
    target: "archive"
    description: "Устаревшие кейсы по решению человека"

# Запреты
constraints:
  delete_without_confirmation: false
  auto_import_without_confirmation: false
