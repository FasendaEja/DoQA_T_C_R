version: '3.8'

services:
  qa-agent:
    build: .
    container_name: qa-agent-system
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/app/workspace
      - ./rules:/app/rules
      - ./config:/app/config
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import config; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
