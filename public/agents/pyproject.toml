[project]
name = "qa-agent-system"
version = "0.1.0"
description = "Agent system for test case preparation, analysis and management"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.30.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "markdown>=3.7",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
]

[project.scripts]
qa-agent = "main:cli_app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
